fail_fast = true

# 1. Fast file-level checks and fixers (instant, fail early on basics)
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "detect-aws-credentials", args = [
    "--allow-missing-credentials",
  ] },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  # { id = "no-commit-to-branch", args = [
  #   "--branch",
  #   "main",
  #   "--branch",
  #   "master",
  # ] },
  { id = "trailing-whitespace" },
]

# 2. Typos (very fast native binary, catches issues across all file types)
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.47.2"
hooks = [{ id = "typos" }]

# 3. Prettier (JS, CSS, HTML, YAML, JSON, Markdown formatting)
[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v3.1.0"
hooks = [{ id = "prettier", types_or = ["javascript", "jsx", "json", "css", "html", "yaml", "markdown"] }]

# 4. Markdown lint (fast, only runs on .md files)
[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.49.0"
hooks = [{ id = "markdownlint", args = ["--fix"] }]

# 5. GitHub Actions lint (fast native binary, only runs on .yml in .github/)
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

# 6. Commit message lint (runs on commit-msg stage, not pre-commit)
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.26.0"
hooks = [{ id = "commitlint", stages = ["commit-msg"], additional_dependencies = ["@commitlint/config-conventional"] }]
