name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install pyftsubset for font subsetting
        run: pip install fonttools brotli

      - name: Security audit
        run: npm audit --omit=dev

      - name: Lint JS
        run: npx eslint .

      - name: Lint CSS
        run: npx stylelint "css/**/*.css"

      - name: Build & smoke tests
        run: npm test

      - name: Unit tests
        run: npm run test:unit

      - name: HTML validation
        run: npm run validate

      - name: Install Chromium dependencies
        run: npx puppeteer browsers install chrome

      - name: E2E tests
        run: npm run test:e2e

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CV_DATA_DIR: data-private/data
      CV_IMAGES_DIR: data-private/images
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: frostyslav/personal-cv-data
          ssh-key: ${{ secrets.DATA_REPO_KEY }}
          path: data-private

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install pyftsubset for font subsetting
        run: pip install fonttools brotli

      - name: Build
        run: npm run build

      - name: Install Chromium for PDF generation
        run: npx puppeteer browsers install chrome

      - name: Generate PDF
        run: node scripts/generate-pdf.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
